<form class="contact-form" action=""https://formsubmit.co/rehertemmanuel@gmail.com" method="POST">

    <h2>Contact Us</h2>

    <input type="text"
           name="first_name"
           placeholder="First "
           required>

    <input type="text"
           name="last_name"
           placeholder="Last Name"
           required>

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <input type="tel"
           name="phone"
           placeholder="Phone Number">


    <input type="text"
           name="referral"
           placeholder="How did you know about us?">

    <textarea name="message"
              placeholder="Comment"
              required></textarea>


    <input type="hidden"
           name="_subject"
           value="New Range View Website Enquiry">

    <input type="hidden"
           name="_template"
           value="table">


    <button type="submit">
        Send
    </button>
